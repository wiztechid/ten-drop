name: TEN DROP Smoke Gate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: JavaScript syntax
        run: node --check js/game.js
      - name: Adversarial gameplay engine
        run: |
          node --check js/core.js
          node --check tests/adversarial-gameplay.test.js
          node tests/adversarial-gameplay.test.js
      - name: Static entrypoint
        run: |
          test -s index.html
          test -s css/game.css
          test -s js/game.js
          test -s js/core.js
          grep -q 'css/game.css' index.html
          grep -q 'js/core.js' index.html
          grep -q 'js/game.js' index.html
      - name: Core gameplay invariants
        run: |
          grep -q 'COLS=6,ROWS=9' js/game.js
          grep -q 'function tenCandidates' js/core.js
          grep -q 'function selectTenGroups' js/core.js
          grep -q 'length>=4' js/core.js
          grep -q 'while(queue.length<3)' js/game.js
          grep -q 'TenDropCore' js/game.js
          grep -q 'levelClearPending' js/game.js
