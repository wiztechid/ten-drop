<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#080d25"><title>Ten Drop — v0.3</title>
<link rel="stylesheet" href="css/game.css?v=0.3.1">
</head>
<body>
<main class="game-shell">
<header>
  <div><span class="eyebrow">TEN DROP</span><h1>Make 10. Make it rain.</h1></div>
  <button id="restart" class="icon-btn" aria-label="Restart">↻</button>
</header>
<section class="hud">
  <div class="stat"><span>SCORE</span><b id="score">0</b></div>
  <div class="objective"><span id="levelLabel">LEVEL 1</span><b id="objective">Make 5 Tens</b><div class="bar"><i id="progress"></i></div></div>
  <div class="stat right"><span>BEST</span><b id="best">0</b></div>
</section>
<section class="preview" aria-label="Number preview"><small>NOW</small><div id="now"></div><small>NEXT</small><div id="next1"></div><div id="next2"></div></section>
<section id="stage" class="stage">
  <div id="callout" class="callout"></div>
  <div id="board" class="board" aria-label="Ten Drop board"></div>
</section>
<section class="controls" aria-label="Controls">
<button id="left" aria-label="Move left">‹</button>
<button id="drop" class="drop">DROP <span>▼</span></button>
<button id="right" aria-label="Move right">›</button>
</section>
<p class="hint">Swipe or use buttons · Match touching numbers that make <b>10</b></p>
</main>
<div id="modal" class="modal hidden"><div class="card"><div class="mascot">10!</div><h2 id="modalTitle">Chapter Clear!</h2><p id="modalText"></p><button id="modalAction">KEEP DROPPING</button></div></div>
<script src="js/core.js?v=0.3.2"></script>
<script src="js/game.js?v=0.3.4"></script>
</body></html>
